<div class="auth">
    <div class="auth__brand">
        <img class="auth__mark" ngSrc="assets/brand/logo-mark.svg" alt="" width="24" height="24" priority />
        Izbik
    </div>
    <h1 class="auth__title">Choose a new password</h1>

    @if (token === null) {
        <p class="auth__text">This reset link is incomplete. Open the link from the mail again, or ask for a new one.</p>
        <p class="auth__footer"><a routerLink="/forgot-password">Send a new link</a></p>
    } @else {
        <form class="auth__form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <label class="field">
                <span class="field__label">New password</span>
                <input class="input" type="password" formControlName="password" autocomplete="new-password" />
                <span class="field__hint">{{ passwordHint }}</span>
            </label>
            <label class="field">
                <span class="field__label">Repeat the password</span>
                <input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password" />
                @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.dirty) {
                    <span class="field__hint">The passwords differ.</span>
                }
            </label>
            @if (error(); as message) {
                <p class="form-error" role="alert">{{ message }}</p>
            }
            <button type="submit" class="btn btn--primary auth__submit" [disabled]="form.invalid || saving()">
                {{ saving() ? 'Saving…' : 'Set password and sign in' }}
            </button>
        </form>
        <p class="auth__footer"><a routerLink="/forgot-password">Send a new link</a> · <a routerLink="/login">Sign in</a></p>
    }

    <fd-language-switch />
</div>

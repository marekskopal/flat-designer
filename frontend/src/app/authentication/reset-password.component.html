<div class="auth">
    <div class="auth__brand">
        <img class="auth__mark" ngSrc="assets/brand/logo-mark.svg" alt="" width="24" height="24" priority />
        Izbik
    </div>
    <h1 class="auth__title">{{ 'auth.reset.title' | translate }}</h1>

    @if (token === null) {
        <p class="auth__text">{{ 'auth.reset.incomplete' | translate }}</p>
        <p class="auth__footer"><a routerLink="/forgot-password">{{ 'auth.reset.newLink' | translate }}</a></p>
    } @else {
        <form class="auth__form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <label class="field">
                <span class="field__label">{{ 'auth.reset.newPassword' | translate }}</span>
                <input class="input" type="password" formControlName="password" autocomplete="new-password" />
                <span class="field__hint">{{ 'auth.passwordHint' | translate }}</span>
            </label>
            <label class="field">
                <span class="field__label">{{ 'auth.reset.repeat' | translate }}</span>
                <input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password" />
                @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.dirty) {
                    <span class="field__hint">{{ 'auth.reset.mismatch' | translate }}</span>
                }
            </label>
            @if (error(); as message) {
                <p class="form-error" role="alert">{{ message }}</p>
            }
            <button type="submit" class="btn btn--primary auth__submit" [disabled]="form.invalid || saving()">
                {{ (saving() ? 'common.saving' : 'auth.reset.submit') | translate }}
            </button>
        </form>
        <p class="auth__footer"><a routerLink="/forgot-password">{{ 'auth.reset.newLink' | translate }}</a> · <a routerLink="/login">{{ 'auth.reset.signIn' | translate }}</a></p>
    }

    <fd-language-switch />
</div>

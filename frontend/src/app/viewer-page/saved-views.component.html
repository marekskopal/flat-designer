@if (views().length > 0) {
    <ul class="views">
        @for (view of views(); track view.id) {
            <li class="view">
                <button type="button" class="view__apply" [disabled]="busy()" [title]="'viewer.views.show' | translate: {name: view.name}" (click)="apply.emit(view)">
                    <span class="view__name">{{ view.name }}</span>
                    @if (view.floorId !== floorId()) {
                        <span class="view__floor">{{ view.floorName }}</span>
                    }
                </button>
                @if (canSave()) {
                    <button type="button" class="icon-button" [title]="'viewer.views.replace' | translate" [attr.aria-label]="'viewer.views.replace' | translate" [disabled]="busy()" (click)="overwrite.emit(view)">
                        <fd-icon name="refresh" [size]="15" />
                    </button>
                    <button type="button" class="icon-button icon-button--danger" [title]="'common.delete' | translate" [attr.aria-label]="'common.delete' | translate" [disabled]="busy()" (click)="remove.emit(view)">
                        <fd-icon name="trash" [size]="15" />
                    </button>
                }
            </li>
        }
    </ul>
}
@if (canSave()) {
    <form class="save" (submit)="submit($event)">
        <input
            class="input input--compact"
            type="text"
            name="name"
            [placeholder]="'viewer.views.placeholder' | translate"
            [attr.aria-label]="'viewer.views.nameLabel' | translate"
            maxlength="100"
            [value]="name()"
            (input)="name.set($any($event.target).value)"
        />
        <button type="submit" class="btn btn--ghost" [disabled]="busy() || name().trim() === ''">{{ 'common.save' | translate }}</button>
    </form>
}
<div class="capture">
    <button type="button" class="btn btn--ghost" [disabled]="busy()" [title]="'viewer.views.captureTip' | translate" (click)="capture.emit('download')">
        <fd-icon name="camera" [size]="15" /> {{ 'viewer.views.capture' | translate }}
    </button>
    @if (canSave()) {
        <button type="button" class="btn btn--ghost" [disabled]="busy()" [title]="'viewer.views.toFilesTip' | translate" (click)="capture.emit('file')">
            <fd-icon name="folder" [size]="15" /> {{ 'viewer.views.toFiles' | translate }}
        </button>
    }
</div>

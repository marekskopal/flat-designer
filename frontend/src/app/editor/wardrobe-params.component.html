<div class="wardrobe">
    <div class="row">
        <label class="cell">
            <span class="cell__label">Doors</span>
            <input
                class="input input--compact"
                type="number"
                min="2"
                max="6"
                step="1"
                [placeholder]="'' + doors()"
                [value]="wardrobe().doors ?? ''"
                [disabled]="disabled()"
                (change)="setDoors($event)"
            />
        </label>
        <label class="cell">
            <span class="cell__label">Plinth <span class="cell__unit">mm</span></span>
            <input
                class="input input--compact"
                type="number"
                min="0"
                step="1"
                placeholder="60"
                [value]="wardrobe().plinth ?? ''"
                [disabled]="disabled()"
                (change)="setPlinth($event)"
            />
        </label>
    </div>
    <label class="cell">
        <span class="cell__label">Frames and tracks</span>
        <select class="input input--compact" [disabled]="disabled()" (change)="setProfileMaterial($event)">
            <option value="" [selected]="wardrobe().profileMaterialId === undefined">Aluminium (default)</option>
            @for (material of materials(); track material.id) {
                <option [value]="material.id" [selected]="material.id === wardrobe().profileMaterialId">{{ material.name }}</option>
            }
        </select>
    </label>
    <div class="cell">
        <span class="cell__label">Mirror <span class="cell__unit">doors from the left</span></span>
        <div class="doors">
            @for (row of doorRows(); track row.door) {
                <label class="door">
                    <input type="checkbox" [checked]="row.mirror" [disabled]="disabled()" (change)="setMirror(row.door, $event)" />
                    {{ row.door }}
                </label>
            }
        </div>
    </div>
    @if (error(); as message) {
        <span class="error">{{ message }}</span>
    }
</div>

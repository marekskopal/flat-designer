<div class="picker" role="group" [attr.aria-label]="'Pages of ' + file().filename">
    <p class="hint">Which page of {{ file().filename }} goes under the plan?</p>
    <ul class="pages">
        @for (page of pages(); track page.page) {
            <li>
                <button
                    type="button"
                    class="page"
                    [disabled]="disabled() || page.widthPx === null"
                    [title]="title(page)"
                    (click)="picked.emit(page.page)"
                >
                    <span class="page__image" [style.aspect-ratio]="aspect(page)">
                        @if (thumbnails().get(page.page); as url) {
                            <!-- eslint-disable-next-line @angular-eslint/template/prefer-ngsrc -- a blob: URL of unknown size, nothing for NgOptimizedImage to optimise -->
                            <img [src]="url" alt="" />
                        }
                    </span>
                    <span class="page__number">{{ page.page }}</span>
                </button>
            </li>
        }
    </ul>
    @if (pageCount() > pages().length) {
        <p class="hint">Only the first {{ pages().length }} of its {{ pageCount() }} pages can be laid.</p>
    }
    <button type="button" class="tool" [disabled]="disabled()" (click)="cancelled.emit()">Cancel</button>
</div>

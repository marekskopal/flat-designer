name: izbik

services:
    proxy:
        build:
            context: ./proxy
            dockerfile: Dockerfile
        ports:
            - "${PROXY_PORT}:80"
        restart: unless-stopped
        depends_on:
            frontend:
                condition: service_healthy
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - frontend
            - backend

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                # The <base href> of the build: the app's pages under APP_PATH.
                BASE_HREF: ${APP_PATH:-}/
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - frontend

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        environment:
            MYSQL_HOST: ${MYSQL_HOST}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            BACKEND_FRANKENPHP_WORKERS: ${BACKEND_FRANKENPHP_WORKERS}
            BACKEND_CORS_ALLOWED_ORIGIN: ${BACKEND_CORS_ALLOWED_ORIGIN}
            BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL}
            APP_PATH: ${APP_PATH:-}
            AUTHORIZATION_TOKEN_KEY: ${AUTHORIZATION_TOKEN_KEY}
            RATE_LIMIT_LOGIN_ATTEMPTS: ${RATE_LIMIT_LOGIN_ATTEMPTS:-5}
            RATE_LIMIT_LOGIN_BACKOFF_CAP_SECONDS: ${RATE_LIMIT_LOGIN_BACKOFF_CAP_SECONDS:-3600}
            RATE_LIMIT_PASSWORD_RESETS_PER_HOUR: ${RATE_LIMIT_PASSWORD_RESETS_PER_HOUR:-5}
            SIGN_UP_ENABLED: ${SIGN_UP_ENABLED:-0}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-25}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            EMAIL_FROM: ${EMAIL_FROM:-}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_REGION: ${S3_REGION}
            S3_BUCKET: ${S3_BUCKET}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE}
            FILE_MAX_SIZE_MB: ${FILE_MAX_SIZE_MB:-25}
            PROXY_HOST: ${PROXY_HOST:-}
            MCP_SESSION_TTL: ${MCP_SESSION_TTL:-86400}
            MCP_SESSION_LOCK_TIMEOUT: ${MCP_SESSION_LOCK_TIMEOUT:-30}
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY}
            MERCURE_PUBLISH_URL: ${MERCURE_PUBLISH_URL:-http://localhost/.well-known/mercure}
            MERCURE_RESOURCE_IDENTIFIER: ${MERCURE_RESOURCE_IDENTIFIER:-}
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - backend

    db:
        image: mariadb:11.8
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - backend
        volumes:
            - izbik_data:/var/lib/mysql

    # S3-compatible storage for uploaded project files. Point S3_* at real S3 in production instead.
    minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
        restart: unless-stopped
        networks:
            - backend
        ports:
            # Admin console (log in with S3_ACCESS_KEY / S3_SECRET_KEY), loopback only.
            - "127.0.0.1:${MINIO_CONSOLE_PORT:-4401}:9001"
        volumes:
            - izbik_files:/data

    # Catches outgoing mail for local testing (SMTP_HOST=mailpit, SMTP_PORT=1025); started only with the `mail` profile
    # (COMPOSE_PROFILES=mail). Its inbox is on http://localhost:<MAILPIT_PORT>.
    mailpit:
        image: axllent/mailpit:v1.33
        restart: unless-stopped
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        networks:
            - backend
        ports:
            - "127.0.0.1:${MAILPIT_PORT:-4402}:8025"
        profiles:
            - mail

networks:
    frontend:
    backend:

volumes:
    izbik_data:
    izbik_files:

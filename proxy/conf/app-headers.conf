# Security headers of the app's pages, included by the location that proxies the frontend (app.conf).
#
# The Content-Security-Policy is nonce based: index.html carries `ngCspNonce="random_nonce_value"`, which the Angular
# build copies onto its inline scripts and styles (and Angular onto the styles it adds at runtime); sub_filter puts the
# request's id there, the same nonce as in the header. sub_filter needs the upstream's answer uncompressed, so the
# request goes without Accept-Encoding (gzip still compresses it towards the browser); it also drops the HTML's ETag
# and Last-Modified, so a browser never revalidates a page whose nonce is gone.
#
# Beside 'self' and the nonce:
# - script-src 'wasm-unsafe-eval': the meshopt decoder of the product models is WebAssembly;
# - style-src 'unsafe-inline' (no nonce, which would void it): three.js labels and the exports set inline styles;
# - Google Fonts (Inter) and Sign in with Google (its script, button frame and styles, as Google documents them);
# - blob: and data: for images, textures, models, PDF previews and downloads made in the browser.
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter random_nonce_value $request_id;

add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'nonce-$request_id' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self' blob: data: https://accounts.google.com/gsi/; frame-src 'self' blob: https://accounts.google.com/gsi/; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

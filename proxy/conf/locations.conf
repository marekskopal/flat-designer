# Shared by the http and ssl server blocks (included in server context).

gzip on;
gzip_min_length   256;
gzip_vary         on;
gzip_proxied      expired no-cache no-store private auth;
gzip_types        text/plain text/css application/json application/javascript text/javascript;
gzip_comp_level   6;

client_max_body_size 2m;

location ~ ^/api/authentication/(login|sign-up|refresh-token)$ {
    limit_req zone=auth burst=10 nodelay;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Project file uploads; the backend enforces the real limit (FILE_MAX_SIZE_MB).
location ~ ^/api/projects/\d+/files$ {
    client_max_body_size 100m;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Project files: an import (multipart, up to the backend's IMPORT_MAX_SIZE_MB; nginx and PHP take 512 MB at most)
# and an export, streamed as it is read. Both may take minutes for a large project.
location = /api/projects/import {
    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/api/projects/\d+/export$ {
    proxy_buffering off;
    proxy_read_timeout 600s;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# One-time upload URLs for MCP agents (PUT, raw body); the backend enforces the real limit (FILE_MAX_SIZE_MB).
location ~ ^/api/uploads/[a-f0-9]+$ {
    client_max_body_size 100m;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# MCP endpoint (Streamable HTTP): answers may be streamed as server-sent events.
location = /mcp {
    client_max_body_size 10m;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/mcp/oauth/(register|token)$ {
    limit_req zone=oauth burst=20 nodelay;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# OAuth discovery documents for MCP clients (RFC 8414, RFC 9728).
location ~ ^/\.well-known/oauth- {
    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Mercure hub (live updates): long-lived server-sent event streams.
location /.well-known/mercure {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
    gzip off;

    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
}

location /api/ {
    proxy_pass http://http_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# The app's pages (the SaaS branch serves them under /app/ and a website at the root).
include /etc/nginx/snippets/app.conf;

server_tokens off;
